services:
  secretrelay:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PAYMENT_ADDRESS=${PAYMENT_ADDRESS:-0x6556b72490a59D81df06393E58C64A3dc8920912}
      - NETWORK=${NETWORK:-base-sepolia}
      - PORT=3000
      - HOST=0.0.0.0
      - ATTESTATION_ENDPOINT=${ATTESTATION_ENDPOINT:-http://host.docker.internal:8080/attestation}
      - ALLOWED_DOMAINS=${ALLOWED_DOMAINS:-}
    restart: unless-stopped
